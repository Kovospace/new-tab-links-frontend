<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tabilinks</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Your bookmarks, links, history and most visited sites on the new tab screen. Your links, on every new tab, on every machine."
    />
    <meta name="theme-color" content="#000000" />

    <!--
      Link previews (Facebook, LinkedIn, Slack, Discord, X, WhatsApp) never run JavaScript, so
      what they show has to be in this file. Absolute addresses are required by the protocol; the
      origin is the one in src/app/core/seo/public-site.json.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tabilinks" />
    <meta property="og:title" content="Tabilinks" />
    <meta
      property="og:description"
      content="Your bookmarks, links, history and most visited sites on the new tab screen. Your links, on every new tab, on every machine."
    />
    <meta property="og:image" content="https://tabilinks.app/images/share/tabilinks-share.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Tabilinks icon beside the name Tabilinks" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
