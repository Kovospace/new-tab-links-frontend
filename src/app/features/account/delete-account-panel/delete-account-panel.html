<section class="delete-account">
  <h1 class="delete-account-panel__heading">{{ 'account.dangerHeading' | translate }}</h1>
  <u class="delete-account-panel__lead">{{ 'account.dangerLead' | translate }}</u>

  @if (viewModel.isConfirmationRequested()) {
    <p role="alert">
      {{ 'account.deleteConfirmPrompt' | translate }}
    </p>

    <button
      type="button"
      [disabled]="viewModel.isDeletionInFlight()"
      (click)="viewModel.confirmDeletion()"
    >
      @if (viewModel.isDeletionInFlight()) {
        {{ 'form.submitting' | translate }}
      } @else {
        {{ 'account.deleteConfirmAction' | translate }}
      }
    </button>

    <button type="button" (click)="viewModel.cancelConfirmation()">
      {{ 'account.deleteCancelAction' | translate }}
    </button>
  } @else {
    <button type="button" (click)="viewModel.requestConfirmation()">
      {{ 'account.deleteAction' | translate }}
    </button>
  }

  @if (viewModel.deleteFailure()) {
    <u role="alert">{{ viewModel.deleteFailure() }}</u>
  }
</section>
