<section class="password-panel">
  <h2 class="password-panel__heading">{{ 'account.passwordHeading' | translate }}</h2>

  @if (accountHasPassword()) {
    <p class="password-panel__lead">{{ 'account.passwordChangeLead' | translate }}</p>
  } @else {
    <p class="password-panel__lead">{{ 'account.passwordSetLead' | translate }}</p>
  }

  <form
    class="password-panel__form"
    [formGroup]="viewModel.passwordForm"
    (ngSubmit)="viewModel.submitPasswordChange()"
  >
    @if (accountHasPassword()) {
      <label class="password-panel__field">
        <span class="password-panel__field-label">{{
          'account.currentPasswordLabel' | translate
        }}</span>
        <input
          class="password-panel__field-input"
          type="password"
          formControlName="currentPassword"
          autocomplete="current-password"
        />
        @if (viewModel.fieldValidationMessages()['currentPassword']; as validationMessage) {
          <small class="password-panel__field-error">{{ validationMessage }}</small>
        }
      </label>
    }

    <label class="password-panel__field">
      <span class="password-panel__field-label">{{ 'account.newPasswordLabel' | translate }}</span>
      <input
        class="password-panel__field-input"
        type="password"
        formControlName="newPassword"
        autocomplete="new-password"
      />
      <small class="password-panel__field-hint">{{ 'account.newPasswordHint' | translate }}</small>
      @if (viewModel.fieldValidationMessages()['newPassword']; as validationMessage) {
        <small class="password-panel__field-error">{{ validationMessage }}</small>
      }
    </label>

    <button class="password-panel__submit" type="submit" [disabled]="viewModel.isSubmitting()">
      @if (viewModel.isSubmitting()) {
        {{ 'form.submitting' | translate }}
      } @else if (accountHasPassword()) {
        {{ 'account.changePasswordAction' | translate }}
      } @else {
        {{ 'account.setPasswordAction' | translate }}
      }
    </button>

    <app-form-feedback
      class="password-panel__feedback"
      [failureMessage]="viewModel.submissionFailure()"
      [successMessage]="viewModel.submissionSuccess()"
      [validationMessages]="viewModel.backendValidationMessages()"
    />
  </form>
</section>
