<article>
  @if (viewModel.loadFailure()) {
    <u class="account-page__failure" role="alert">{{ viewModel.loadFailure() }}</u>
  }

  @if (viewModel.isLoading()) {
    <i class="account-page__loading" role="status">{{ 'form.submitting' | translate }}</i>
  }

  @if (viewModel.hasAccount()) {
    <app-profile-panel [currentDisplayName]="viewModel.currentDisplayName()" />

    @if (viewModel.canPurchasePremium()) {
      <app-premium-panel />
    }

    @if (viewModel.canRequestRefund()) {
      <app-refund-panel [refundableUntil]="viewModel.refundableUntil()" />
    }

    @if (viewModel.canCancelSubscription()) {
      <app-cancel-subscription-panel />
    }

    <app-password-panel [accountHasPassword]="viewModel.hasPassword()" />

    <app-delete-account-panel />
  }
</article>
