<article class="account-page">

  @if (viewModel.loadFailure()) {
    <u class="account-page__failure" role="alert">{{ viewModel.loadFailure() }}</u>
  }

  @if (viewModel.isLoading()) {
    <i class="account-page__loading" role="status">{{ 'form.submitting' | translate }}</i>
  }

  @if (viewModel.hasAccount()) {

    <app-profile-panel
      class="account-page__profile-panel"
      [currentDisplayName]="viewModel.currentDisplayName()"
    />

    <app-password-panel
      class="account-page__password-panel"
      [accountHasPassword]="viewModel.hasPassword()"
    />

    <app-delete-account-panel class="account-page__delete-panel" />

  }
</article>
