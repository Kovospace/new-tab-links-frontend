<article>
  <h1>{{ 'legal.sitemapHeading' | translate }}</h1>
  <p>{{ 'legal.sitemapLead' | translate }}</p>

  <ul>
    @for (sitemapEntry of viewModel.sitemapEntries(); track sitemapEntry.routerLink) {
      <li>
        <a [routerLink]="sitemapEntry.routerLink">{{
          sitemapEntry.labelTranslationKey | translate
        }}</a>
      </li>
    }
  </ul>
</article>
