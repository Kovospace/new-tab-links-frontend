<article>
  <section>
    <h1>{{ 'home.heading' | translate }}</h1>
    <p class="home-page__tagline">{{ 'site.tagline' | translate }}</p>
    <p class="home-page__lead">{{ 'home.leadParagraph' | translate }}</p>
    <!--    <a class="home-page__call-to-action button" [routerLink]="downloadLink">{{-->
    <!--      'home.callToAction' | translate-->
    <!--    }}</a>-->
  </section>

  <section class="home-page__demo">
    <app-demo-slideshow />
  </section>

  <section>
    <ul>
      @for (presentedFeature of viewModel.presentedFeatures(); track presentedFeature.slug) {
        <li class="home-page__feature">
          <app-rendered-markdown [html]="presentedFeature.html" />
        </li>
      }
    </ul>
  </section>

  <app-plan-offers />
</article>
