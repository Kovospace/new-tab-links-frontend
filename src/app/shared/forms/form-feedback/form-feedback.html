@if (failureMessage()) {
  <p role="alert">{{ failureMessage() }}</p>
}

@if (successMessage()) {
  <p role="status">{{ successMessage() }}</p>
}

@if (validationMessages().length) {
  <ul role="alert">
    @for (validationMessage of validationMessages(); track validationMessage) {
      <li>{{ validationMessage }}</li>
    }
  </ul>
}
