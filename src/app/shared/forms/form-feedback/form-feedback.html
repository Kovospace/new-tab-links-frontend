@if (failureMessage()) {
  <u class="form-feedback__error">{{ failureMessage() }}</u>
}

@if (successMessage()) {
  <i class="form-feedback__success">{{ successMessage() }}</i>
}

@if (validationMessages().length) {
  <ul role="alert">
    @for (validationMessage of validationMessages(); track validationMessage) {
      <li class="form-feedback__validation_message">{{ validationMessage }}</li>
    }
  </ul>
}
