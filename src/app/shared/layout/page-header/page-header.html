<header class="page-header">

  <div class="page-header__start">
    <app-language-switcher />
  </div>

  <nav class="page-header__navigation" [attr.aria-label]="'site.title' | translate">
    <ul class="page-header__navigation-list">
      @for (navigationEntry of viewModel.navigationEntries(); track navigationEntry.routerLink) {
        <li class="page-header__navigation-item">
          <a
            class="page-header__navigation-link"
            [routerLink]="navigationEntry.routerLink"
            routerLinkActive="page-header__navigation-link--active"
            [routerLinkActiveOptions]="navigationEntry.activeWhen"
            >{{ navigationEntry.labelTranslationKey | translate }}</a
          >
        </li>
      }
    </ul>
  </nav>

  <div class="page-header__end">
    @if (viewModel.isSignedIn()) {
      <span>{{ viewModel.signedInStatus() }}</span>
      <!-- The only way to sign out anywhere on the site, so it stays beside the name. -->
      <button class="page-header__sign-out" type="button" (click)="viewModel.signOut()">
        {{ 'nav.logout' | translate }}
      </button>
    }
  </div>

</header>
