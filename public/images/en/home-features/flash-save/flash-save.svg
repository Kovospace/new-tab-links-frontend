<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 12 896 276" role="img" aria-labelledby="title">
  <title id="title">A page saved from the right-click menu in one click, landing straight in a group of links</title>
  <defs>
    <!-- One link tile: favicon and its name; top-left corner at 0,0. -->
    <g id="tile">
      <rect width="130" height="34" rx="8" fill="#000" stroke="#666" stroke-width="3"/>
      <circle cx="17" cy="17" r="6" fill="#e0a100"/>
      <line x1="31" y1="17" x2="110" y2="17" stroke="#666" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- A lightning bolt, the sign of Flash save; about 18 wide and 28 tall, top at 0,0. -->
    <path id="bolt" d="M11 0 L0 16 H8 L5 28 L18 10 H10 Z" stroke-linejoin="round"/>
    <!-- Mouse pointer, tip at 0,0. -->
    <path id="pointer" d="M0 0 V26 L7 20 L12 31 L17 29 L12 18 H21 Z"
          fill="#fff" stroke="#000" stroke-linejoin="round" stroke-width="2.5"/>
    <marker id="arrowhead" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="16" markerHeight="16"
            markerUnits="userSpaceOnUse" orient="auto">
      <polyline points="1,1 7,6 1,11" fill="none" stroke="#f5b800" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ===== A web page, right-clicked ===== -->
  <g stroke="#666" stroke-width="4" fill="none">
    <rect x="20" y="30" width="380" height="240" rx="18" fill="#111"/>
    <line x1="20" y1="80" x2="400" y2="80"/>
    <circle cx="48" cy="55" r="9"/>
    <rect x="70" y="44" width="230" height="22" rx="11"/>
    <rect x="315" y="44" width="62" height="22" rx="11"/>
  </g>
  <!-- what the page shows: a video and its lines of text -->
  <rect x="45" y="100" width="150" height="90" rx="10" fill="none" stroke="#666" stroke-width="4"/>
  <path d="M108 128 L108 162 L134 145 Z" fill="#666"/>
  <g stroke="#666" stroke-width="4" stroke-linecap="round">
    <line x1="45" y1="212" x2="190" y2="212"/>
    <line x1="45" y1="234" x2="160" y2="234"/>
  </g>

  <!-- the right-click menu, its Flash save entry lit -->
  <rect x="215" y="105" width="160" height="150" rx="10" fill="#000" stroke="#666" stroke-width="3"/>
  <g stroke="#666" stroke-width="4" stroke-linecap="round">
    <line x1="232" y1="130" x2="330" y2="130"/>
    <line x1="232" y1="160" x2="310" y2="160"/>
    <line x1="232" y1="230" x2="320" y2="230"/>
  </g>
  <rect x="222" y="180" width="146" height="32" rx="7" fill="#e0a100" fill-opacity="0.15"
        stroke="#f5b800" stroke-width="3"/>
  <use href="#bolt" x="233" y="182" fill="#f5b800"/>
  <line x1="262" y1="196" x2="345" y2="196" stroke="#f5b800" stroke-width="4" stroke-linecap="round"/>

  <!-- one click -->
  <g stroke="#bbb" stroke-width="3" stroke-linecap="round" fill="none">
    <line x1="314" y1="190" x2="306" y2="182"/>
    <line x1="320" y1="188" x2="320" y2="177"/>
    <line x1="326" y1="190" x2="334" y2="182"/>
  </g>
  <use href="#pointer" x="320" y="196"/>

  <!-- ===== The new tab: the Flash save group ===== -->
  <g stroke="#666" stroke-width="4" fill="none">
    <rect x="500" y="30" width="380" height="240" rx="18" fill="#111"/>
    <line x1="500" y1="80" x2="880" y2="80"/>
    <circle cx="528" cy="55" r="9"/>
    <rect x="550" y="44" width="230" height="22" rx="11"/>
    <rect x="795" y="44" width="62" height="22" rx="11"/>
  </g>

  <!-- the group, headed by the bolt -->
  <use href="#bolt" x="528" y="92" fill="#e0a100"/>
  <line x1="556" y1="106" x2="640" y2="106" stroke="#bbb" stroke-width="5" stroke-linecap="round"/>
  <use href="#tile" x="526" y="128"/>
  <use href="#tile" x="526" y="170"/>
  <!-- the page just kept, newest at the end -->
  <rect x="526" y="212" width="130" height="34" rx="8" fill="#000" stroke="#f5b800" stroke-width="4"/>
  <circle cx="543" cy="229" r="6" fill="#e0a100"/>
  <line x1="557" y1="229" x2="636" y2="229" stroke="#666" stroke-width="4" stroke-linecap="round"/>

  <!-- the groups it will be sorted into later, dimmed -->
  <g opacity="0.45">
    <line x1="702" y1="106" x2="790" y2="106" stroke="#bbb" stroke-width="5" stroke-linecap="round"/>
    <use href="#tile" x="700" y="128"/>
    <use href="#tile" x="700" y="170"/>
  </g>
  <!-- ===== Straight across, no questions - drawn last, over both windows ===== -->
  <path d="M378 196 C430 196 450 222 514 229" fill="none" stroke="#f5b800" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="2 10" marker-end="url(#arrowhead)"/>
</svg>
