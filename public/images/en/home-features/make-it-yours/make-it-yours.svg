<svg xmlns="http://www.w3.org/2000/svg" viewBox="18 2 680 300" role="img" aria-labelledby="title">
  <title id="title">The same new tab light and dark, glass over a background you choose - or your own picture</title>
  <defs>
    <!-- The page area of the window: below the title bar, inside the rounded frame. -->
    <clipPath id="page">
      <path d="M40 72 H520 V262 Q520 280 502 280 H58 Q40 280 40 262 Z"/>
    </clipPath>
    <!-- Where the dark theme is shown, left of the divider; the light one is the rest. -->
    <clipPath id="dark-side">
      <polygon points="40,72 300,72 260,280 40,280"/>
    </clipPath>
    <clipPath id="light-side">
      <polygon points="300,72 520,72 520,280 260,280"/>
    </clipPath>
    <!-- One background picture: sky, sun and two ridges; drawn per use in a 480 x 208 box. -->
    <g id="picture">
      <rect width="480" height="208" fill="#0b2a7a"/>
      <circle cx="318" cy="24" r="15" fill="#fff" fill-opacity="0.85"/>
      <polygon points="0,150 110,70 210,140 300,86 480,170 480,208 0,208" fill="#004fff"/>
      <polygon points="0,190 140,120 260,180 380,130 480,176 480,208 0,208" fill="#002a8f"/>
    </g>
    <!-- A group of links, 130 x 136, top-left corner at 0,0; its glass and lines set per theme. -->
    <g id="group-shape">
      <rect width="130" height="136" rx="12"/>
    </g>
    <g id="group-content">
      <line x1="14" y1="22" x2="80" y2="22" stroke-width="5" stroke-linecap="round"/>
      <circle cx="22" cy="54" r="7" fill="#004fff" stroke="none"/>
      <line x1="36" y1="54" x2="110" y2="54" stroke-width="4" stroke-linecap="round"/>
      <circle cx="22" cy="84" r="7" fill="#004fff" stroke="none"/>
      <line x1="36" y1="84" x2="96" y2="84" stroke-width="4" stroke-linecap="round"/>
      <circle cx="22" cy="114" r="7" fill="#004fff" stroke="none"/>
      <line x1="36" y1="114" x2="104" y2="114" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="groups">
      <use href="#group-shape" x="62" y="122"/>
      <use href="#group-shape" x="215" y="122"/>
      <use href="#group-shape" x="368" y="122"/>
    </g>
    <g id="groups-content">
      <use href="#group-content" x="62" y="122"/>
      <use href="#group-content" x="215" y="122"/>
      <use href="#group-content" x="368" y="122"/>
    </g>
    <!-- One background tile of the library, 104 x 58; top-left corner at 0,0. -->
    <clipPath id="tile">
      <rect width="104" height="58" rx="8"/>
    </clipPath>
    <!-- Mouse pointer, tip at 0,0. -->
    <path id="pointer" d="M0 0 V26 L7 20 L12 31 L17 29 L12 18 H21 Z"
          fill="#fff" stroke="#000" stroke-linejoin="round" stroke-width="2.5"/>
  </defs>

  <!-- ===== The browser window ===== -->
  <rect x="40" y="20" width="480" height="260" rx="18" fill="#111"/>

  <!-- ===== The page: one picture behind it, the groups glass over it ===== -->
  <g clip-path="url(#page)">
    <use href="#picture" x="40" y="72"/>

    <!-- dark theme, left of the divider -->
    <g clip-path="url(#dark-side)">
      <use href="#groups" fill="#111" fill-opacity="0.6" stroke="#666" stroke-width="3"/>
      <use href="#groups-content" stroke="#bbb"/>
    </g>

    <!-- light theme, right of it -->
    <g clip-path="url(#light-side)">
      <use href="#groups" fill="#eee" fill-opacity="0.7" stroke="#fff" stroke-width="3"/>
      <use href="#groups-content" stroke="#111"/>
    </g>

    <!-- the divider between the two themes -->
    <line x1="300" y1="72" x2="260" y2="280" stroke="#fff" stroke-width="4" stroke-linecap="round"
          stroke-dasharray="2 10"/>
  </g>

  <!-- the window's frame and title bar, over the page -->
  <g stroke="#666" stroke-width="4" fill="none">
    <rect x="40" y="20" width="480" height="260" rx="18"/>
    <line x1="40" y1="72" x2="520" y2="72"/>
    <circle cx="68" cy="46" r="9"/>
    <rect x="90" y="35" width="330" height="22" rx="11"/>
    <rect x="435" y="35" width="62" height="22" rx="11"/>
  </g>

  <!-- ===== The library of backgrounds ===== -->
  <!-- the one in use: the picture behind the page -->
  <g transform="translate(570 24)">
    <g clip-path="url(#tile)">
      <use href="#picture" transform="scale(0.2167 0.2788)"/>
    </g>
    <rect width="104" height="58" rx="8" fill="none" stroke="#4a82ff" stroke-width="4"/>
  </g>

  <!-- another one -->
  <g transform="translate(570 94)">
    <g clip-path="url(#tile)">
      <rect width="104" height="58" fill="#1a1a1a"/>
      <circle cx="26" cy="20" r="8" fill="#fff" fill-opacity="0.7"/>
      <path d="M0 40 Q26 26 52 38 T104 34 V58 H0 Z" fill="#009d15"/>
      <path d="M0 50 Q30 40 60 50 T104 46 V58 H0 Z" fill="#006b0e"/>
    </g>
    <rect width="104" height="58" rx="8" fill="none" stroke="#666" stroke-width="3"/>
  </g>

  <!-- a picture of your own -->
  <g transform="translate(570 164)">
    <rect width="104" height="58" rx="8" fill="#000" stroke="#666" stroke-width="3" stroke-dasharray="6 6"/>
    <g stroke="#bbb" stroke-width="5" stroke-linecap="round">
      <line x1="52" y1="17" x2="52" y2="41"/>
      <line x1="40" y1="29" x2="64" y2="29"/>
    </g>
  </g>

  <!-- more to come -->
  <g transform="translate(570 234)" opacity="0.6">
    <rect width="104" height="46" rx="8" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="6 6"/>
    <circle cx="38" cy="23" r="4" fill="#666"/>
    <circle cx="52" cy="23" r="4" fill="#666"/>
    <circle cx="66" cy="23" r="4" fill="#666"/>
  </g>

  <!-- the choice, and where it went -->
  <path d="M566 53 C548 53 540 70 532 84" fill="none" stroke="#4a82ff" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="2 10"/>
  <use href="#pointer" x="640" y="46"/>
</svg>
