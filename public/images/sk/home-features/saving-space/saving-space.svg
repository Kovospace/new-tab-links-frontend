<svg xmlns="http://www.w3.org/2000/svg" viewBox="2 12 866 316" role="img" aria-labelledby="title">
  <title id="title">Bez panela záložiek zostane stránke viac miesta na výšku</title>
  <defs>
    <!-- Browser window: frame, toolbar, address bar; top-left corner at 0,0, 370 x 280. -->
    <g id="window" stroke="#666" stroke-width="4" fill="none">
      <rect width="370" height="280" rx="18" fill="#111"/>
      <line y1="50" x2="370" y2="50"/>
      <circle cx="28" cy="25" r="9"/>
      <rect x="50" y="14" width="220" height="22" rx="11"/>
      <rect x="285" y="14" width="62" height="22" rx="11"/>
    </g>
    <!-- One link tile: favicon and its name; top-left corner at 0,0. -->
    <g id="tile">
      <rect width="70" height="40" rx="8" fill="#000" stroke="#666" stroke-width="3"/>
      <circle cx="16" cy="20" r="6" fill="#004fff"/>
      <line x1="28" y1="20" x2="58" y2="20" stroke="#666" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- A group of links as Tabilinks shows it: a heading and a row of tiles. -->
    <g id="group">
      <line x1="2" y1="5" x2="90" y2="5" stroke="#bbb" stroke-width="5" stroke-linecap="round"/>
      <use href="#tile" y="18"/>
      <use href="#tile" x="85" y="18"/>
      <use href="#tile" x="170" y="18"/>
      <use href="#tile" x="255" y="18"/>
    </g>
    <!-- One bookmark on the bookmarks bar: a folder and a name. -->
    <g id="bookmark">
      <rect width="58" height="18" rx="9" fill="none" stroke="#666" stroke-width="3"/>
      <path d="M9 5 H14 L16 7 H22 V13 H9 Z" fill="#666"/>
      <line x1="28" y1="9" x2="48" y2="9" stroke="#666" stroke-width="3" stroke-linecap="round"/>
    </g>
    <clipPath id="right-window-inside">
      <rect x="480" y="30" width="370" height="280" rx="18"/>
    </clipPath>
  </defs>

  <!-- ===== With the bookmarks bar: it eats a strip of the page ===== -->
  <use href="#window" x="20" y="30"/>
  <g>
    <use href="#bookmark" x="38" y="89"/>
    <use href="#bookmark" x="106" y="89"/>
    <use href="#bookmark" x="174" y="89"/>
    <use href="#bookmark" x="242" y="89"/>
    <use href="#bookmark" x="310" y="89"/>
  </g>
  <line x1="20" y1="115" x2="390" y2="115" stroke="#666" stroke-width="4"/>
  <rect x="28" y="84" width="354" height="28" rx="8" fill="#FF2D32" fill-opacity="0.15"
        stroke="#FF2D32" stroke-width="4"/>
  <use href="#group" x="40" y="135"/>
  <use href="#group" x="40" y="215"/>

  <!-- ===== Without it: the page moves up and the strip is won back ===== -->
  <use href="#window" x="480" y="30"/>
  <use href="#group" x="500" y="100"/>
  <use href="#group" x="500" y="180"/>
  <g clip-path="url(#right-window-inside)">
    <rect x="484" y="272" width="362" height="40" fill="#009d15" fill-opacity="0.25"/>
  </g>
  <line x1="484" y1="272" x2="846" y2="272" stroke="#009d15" stroke-width="4"
        stroke-dasharray="10 8" stroke-linecap="round"/>
  <!-- the height gained -->
  <g stroke="#009d15" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="665" y1="278" x2="665" y2="302"/>
    <polyline points="658,284 665,277 672,284"/>
    <polyline points="658,296 665,303 672,296"/>
  </g>
</svg>
