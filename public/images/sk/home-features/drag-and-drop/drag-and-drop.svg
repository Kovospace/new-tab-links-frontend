<svg xmlns="http://www.w3.org/2000/svg" viewBox="117 12 636 256" role="img" aria-labelledby="title">
  <title id="title">Odkaz sa presúva ťahaním myšou z jednej skupiny do druhej</title>
  <defs>
    <!-- One link tile: favicon and its name; top-left corner at 0,0. -->
    <g id="tile">
      <rect width="70" height="40" rx="8" fill="#000" stroke="#666" stroke-width="3"/>
      <circle cx="16" cy="20" r="6" fill="#004fff"/>
      <line x1="28" y1="20" x2="58" y2="20" stroke="#666" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- Mouse pointer, tip at 0,0. -->
    <path id="pointer" d="M0 0 V26 L7 20 L12 31 L17 29 L12 18 H21 Z"
          fill="#fff" stroke="#000" stroke-linejoin="round" stroke-width="2.5"/>
    <marker id="arrowhead" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="16" markerHeight="16"
            markerUnits="userSpaceOnUse" orient="auto">
      <polyline points="1,1 7,6 1,11" fill="none" stroke="#4a82ff" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ===== The browser window ===== -->
  <g stroke="#666" stroke-width="4" fill="none">
    <rect x="135" y="30" width="600" height="220" rx="18" fill="#111"/>
    <line x1="135" y1="80" x2="735" y2="80"/>
    <circle cx="163" cy="55" r="9"/>
    <rect x="185" y="44" width="420" height="22" rx="11"/>
    <rect x="620" y="44" width="92" height="22" rx="11"/>
  </g>

  <!-- ===== Two groups of links ===== -->
  <g stroke="#bbb" stroke-width="5" stroke-linecap="round">
    <line x1="162" y1="105" x2="250" y2="105"/>
    <line x1="557" y1="105" x2="645" y2="105"/>
  </g>
  <use href="#tile" x="160" y="122"/>
  <use href="#tile" x="245" y="122"/>
  <use href="#tile" x="160" y="177"/>
  <use href="#tile" x="555" y="122"/>
  <use href="#tile" x="640" y="122"/>
  <use href="#tile" x="640" y="177"/>

  <!-- where the link came from -->
  <rect x="245" y="177" width="70" height="40" rx="8" fill="none" stroke="#666" stroke-width="3"
        stroke-dasharray="6 6"/>
  <!-- where it will be dropped -->
  <rect x="555" y="177" width="70" height="40" rx="8" fill="#004fff" fill-opacity="0.15"
        stroke="#4a82ff" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- ===== Its way across ===== -->
  <g stroke="#4a82ff" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M322 197 C355 192 372 165 390 145" stroke-dasharray="2 10"/>
    <path d="M482 132 C515 140 530 165 545 190" stroke-dasharray="2 10" marker-end="url(#arrowhead)"/>
  </g>

  <!-- ===== The link being dragged: lifted and tilted ===== -->
  <g transform="translate(435 125) rotate(-8)">
    <rect x="-29" y="-12" width="70" height="40" rx="8" fill="#000" opacity="0.7"/>
    <rect x="-35" y="-20" width="70" height="40" rx="8" fill="#000" stroke="#4a82ff" stroke-width="4"/>
    <circle cx="-19" cy="0" r="6" fill="#004fff"/>
    <line x1="-7" y1="0" x2="23" y2="0" stroke="#666" stroke-width="4" stroke-linecap="round"/>
  </g>
  <use href="#pointer" x="445" y="128"/>
</svg>
