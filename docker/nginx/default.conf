### ---------------------------------------------------------------------------
### NewTabLinks frontend - static hosting for the Angular bundle.
###
### Port 8080 because the image runs unprivileged (no capability to bind 80) and
### because the Helm chart's containerPort defaults to 8080.
### ---------------------------------------------------------------------------

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/conf.d/security-headers.conf;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json text/markdown;

    # Nothing here identifies the server version to a visitor.
    server_tokens off;

    ### Liveness and readiness. The Helm chart renders probes only when healthPath
    ### is set, so the deployment must point healthPath at this.
    location = /healthz {
        include /etc/nginx/conf.d/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    ### The runtime configuration written by the entrypoint. Never cached: it is
    ### the one file whose contents differ between deployments of the same image,
    ### and a stale copy would point the browser at the wrong backend.
    location = /config.json {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        alias /var/www/runtime-config/config.json;
    }

    ### The home page, rendered at build time. Never cached either: it names the
    ### hashed bundles, so a cached copy pins the visitor to the previous release.
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    ### For crawlers, both generated at build time by scripts/build-crawler-files.mjs.
    ### Unhashed and rewritten with every release that adds a tip, so cached only
    ### briefly. They need their own location because nothing else serves .txt or
    ### .xml: without one, the SPA fallback answered /robots.txt with the shell.
    location ~ ^/(?:robots\.txt|sitemap\.xml)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        charset utf-8;
        charset_types text/plain text/xml;
        try_files $uri =404;
    }

    ### Build output carrying a content hash in its name. The name changes whenever
    ### the contents do, so these can be cached indefinitely.
    location ~* "-[A-Z0-9]{6,}\.(?:js|css)$" {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    ### Translation files. Their names carry no hash and their contents do change,
    ### so the browser must revalidate rather than assume.
    location /i18n/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type application/json;
        try_files $uri =404;
    }

    ### Written content - the tips' markdown and the index generated from it at
    ### build time. Unhashed and edited like the translations, so revalidated.
    ### Not /tips/: that folder holds the tips' pages rendered at build time.
    location /content/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types {
            text/markdown   md;
            application/json json;
        }
        charset utf-8;
        charset_types text/markdown application/json;
        try_files $uri =404;
    }

    ### The ad slot, framed by the extension's new tab page. The one place that
    ### may be framed from outside this site: frame-ancestors allows the extension
    ### (and this site itself) instead of the site-wide X-Frame-Options, which
    ### would block it and must therefore not be sent here. ^~ keeps the image
    ### rule below from taking over anything under /slot/. Requested with every
    ### new tab a user opens, so cached briefly; its content still changes
    ### without an extension release.
    location ^~ /slot/ {
        include /etc/nginx/conf.d/security-headers-shared.conf;
        add_header Content-Security-Policy "frame-ancestors 'self' chrome-extension:" always;
        add_header Cache-Control "public, max-age=300" always;
        charset utf-8;
        try_files $uri =404;
    }

    ### Everything else served from public/ - the favicon, and the packaged
    ### extension once it exists. Unhashed names, so a short cache only.
    location ~* \.(?:png|jpe?g|gif|svg|ico|webp|woff2?|crx)$ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    ### Every public page, in every language, rendered to HTML at build time as
    ### <path>/index.html (src/app/app.routes.server.ts). Like the shell, each one
    ### names the hashed bundles, so it is revalidated on every visit. The ETag
    ### turns that into a 304 when nothing changed.
    ###
    ### Anything that is neither a file nor a rendered page is a real 404,
    ### answered with the browser-only shell so the visitor still gets the
    ### site's own "page not found". Before pages were rendered at build time,
    ### every address answered 200 with the shell, so a search engine took any
    ### mistyped address for a page.
    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        error_page 404 /index.csr.html;
        try_files $uri $uri/index.html =404;
    }

    ### Pages rendered only in the browser, from the shell. They concern one
    ### signed-in person or carry the backend's one-time addresses:
    ### /activate?token=..., /reset-password?token=... and /auth/callback?code=...
    ### must answer 200, or every mailed link and every Google sign-in breaks.
    ###
    ### Lists every route that app.routes.server.ts leaves to the browser. A route
    ### missing here still works, because the 404 above is answered with the same
    ### shell, but it carries a 404 status, which a mailed link should not.
    location ~ ^/(?:register|login|activate|reset-password|auth/callback|devices|account|thank-you|admin)(?:/|$) {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files /index.csr.html =404;
    }

    ### The browser-only shell, when reached as the 404 page above. Never cached,
    ### for the same reason as index.html.
    location = /index.csr.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
}
