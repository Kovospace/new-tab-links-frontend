# Headers every response carries, including the ones that may be framed.
#
# Split from security-headers.conf only so that /slot/ can take these without
# X-Frame-Options: that page is framed by the extension, and SAMEORIGIN would
# block it. Everything else includes security-headers.conf, which includes this.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
