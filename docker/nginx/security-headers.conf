# Headers every response carries.
#
# Included rather than declared once at server level because nginx's add_header
# directives are *replaced*, not merged, by any block that declares its own - so a
# location that sets Cache-Control would otherwise silently drop all of these.
# Every location below that uses add_header includes this file too.
#
# The headers that are safe on a framed page live in security-headers-shared.conf;
# this adds the one that is not. /slot/ includes only the shared file.

include /etc/nginx/conf.d/security-headers-shared.conf;
add_header X-Frame-Options "SAMEORIGIN" always;
